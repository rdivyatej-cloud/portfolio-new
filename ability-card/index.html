<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Divyatej Rallapalli — Ability Card</title>
<link rel="preload" href="../fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: 'Onest';
  font-style: normal;
  font-display: swap;
  font-weight: 100 900;
  src: url(../fonts/onest-latin.woff2) format('woff2');
}
*, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #070707;
  --fg: #f5f3ef;
}
html, body {
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 50% 40%, #161514 0%, #080808 100%);
  color: var(--fg);
  font-family: 'Onest', system-ui, sans-serif;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1200px;
}

/* Card Container */
.stage {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  width: 100%;
  height: 100%;
}

.hc {
  position: relative;
  width: min(85vw, 340px);
  aspect-ratio: 5 / 7;
  background: none;
  border: none;
  cursor: grab;
  outline: none;
  transform-style: preserve-3d;
  will-change: transform;
  transition: transform 0.15s ease-out;
}
.hc:active {
  cursor: grabbing;
}

.hc__in {
  position: absolute;
  inset: 0;
  border-radius: 20px;
  transform-style: preserve-3d;
  transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 30px 70px -15px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.12);
}
.hc.flip .hc__in {
  transform: rotateY(180deg);
}

.hc__face {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform-style: preserve-3d;
}

.hc__front {
  background: #0d0c0b;
}

.hc__back {
  background: #0d0c0b;
  transform: rotateY(180deg);
}

.hc__face img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  display: block;
}

.hc__plate {
  z-index: 3;
}

.hc__win {
  position: absolute;
  inset: 0;
  z-index: 2;
}

/* Holographic dynamic glare and sheen */
.hc__foil {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  mix-blend-mode: color-dodge;
  opacity: var(--foil-op, 0.4);
  background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255,255,255,0.7) 0%, rgba(0,229,255,0.4) 30%, rgba(255,107,74,0.3) 60%, transparent 80%);
  transition: opacity 0.3s;
}

.hc__glare {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  mix-blend-mode: overlay;
  opacity: var(--glare-op, 0.5);
  background: linear-gradient(135deg, rgba(255,255,255,0.6) 0%, transparent 50%, rgba(0,0,0,0.5) 100%);
}

.nav-bar {
  position: absolute;
  top: 1.5rem;
  left: 2rem;
  right: 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.6rem 1.2rem;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 500;
  transition: background 0.2s, transform 0.2s;
}
.back-btn:hover {
  background: rgba(255,255,255,0.18);
  transform: translateY(-1px);
}
.hint {
  position: absolute;
  bottom: 2rem;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.04em;
  pointer-events: none;
  text-align: center;
}
</style>
</head>
<body>

<div class="nav-bar">
  <a href="../" class="back-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span>Back to Portfolio</span>
  </a>
  <a href="../assets/resumedt.pdf" download="Divyatej_Rallapalli_CV.pdf" class="back-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    <span>Download CV</span>
  </a>
</div>

<div class="stage">
  <button class="hc" id="hc" aria-label="Flip ability card">
    <div class="hc__in">
      <div class="hc__face hc__front">
        <div class="hc__win">
          <img src="../card/win_bg.webp" alt="">
          <img src="../card/win_sub.webp" alt="">
        </div>
        <img class="hc__plate" src="../card/plate.webp" alt="Divyatej Rallapalli's ability card">
        <div class="hc__foil"></div>
        <div class="hc__glare"></div>
      </div>
      <div class="hc__face hc__back">
        <img src="../card/back.webp" alt="Divyatej Rallapalli card back">
        <div class="hc__foil"></div>
        <div class="hc__glare"></div>
      </div>
    </div>
  </button>
  <p class="hint">Move cursor to tilt · Click to flip card</p>
</div>

<script>
// Post ready to parent frame if embedded
if (window.parent !== window) {
  try {
    window.parent.postMessage({ holo: 'progress', p: 1 }, '*');
    window.parent.postMessage({ holo: 'ready' }, '*');
  } catch (e) {}
}

const hc = document.getElementById('hc');
let isFlipped = false;
let rotX = 0, rotY = 0;
let targetRotX = 0, targetRotY = 0;

hc.addEventListener('click', () => {
  isFlipped = !isFlipped;
  hc.classList.toggle('flip', isFlipped);
});

window.addEventListener('pointermove', (e) => {
  const rect = hc.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dx = (e.clientX - cx) / (window.innerWidth / 2);
  const dy = (e.clientY - cy) / (window.innerHeight / 2);

  targetRotY = dx * 20;
  targetRotX = -dy * 20;

  const gx = ((e.clientX - rect.left) / rect.width) * 100;
  const gy = ((e.clientY - rect.top) / rect.height) * 100;
  hc.style.setProperty('--gx', gx + '%');
  hc.style.setProperty('--gy', gy + '%');
  hc.style.setProperty('--foil-op', Math.min(0.7, Math.max(0.2, Math.abs(dx) + Math.abs(dy))));
});

window.addEventListener('pointerleave', () => {
  targetRotX = 0;
  targetRotY = 0;
  hc.style.setProperty('--foil-op', '0.35');
});

function animate() {
  rotX += (targetRotX - rotX) * 0.1;
  rotY += (targetRotY - rotY) * 0.1;
  hc.style.transform = \`rotateX(\${rotX.toFixed(2)}deg) rotateY(\${rotY.toFixed(2)}deg)\`;
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
